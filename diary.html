<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>交易日记</title>
<style>
  :root{
    /* macOS Sequoia-ish tokens */
    --glass:rgba(255,255,255,.72);
    --glass-strong:rgba(255,255,255,.88);
    --border:rgba(0,0,0,.07);
    --border-strong:rgba(0,0,0,.12);
    --line:rgba(0,0,0,.05);
    --line-strong:rgba(0,0,0,.08);
    --text:#1d1d1f;
    --text-2:#424245;
    --text-3:#72727a;
    --text-soft:rgba(29,29,31,.55);
    --blue:#007aff;
    --blue-soft:rgba(0,122,255,.12);
    --green:#34c759;
    --green-soft:rgba(52,199,89,.14);
    --red:#ff3b30;
    --red-soft:rgba(255,59,48,.14);
    --shadow-card:0 1px 0 rgba(255,255,255,.8) inset, 0 3px 20px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.05);
    --shadow-soft:0 2px 8px rgba(0,0,0,.05), 0 0 0 .5px rgba(0,0,0,.05);
    --radius-lg:22px;
    --radius:14px;
    --radius-sm:10px;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:var(--font); color:var(--text);
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
    min-height:100vh;
    background:#ffffff;
  }

  /* ===== App container ===== */
  .app{
    position:relative;
    max-width:1280px;
    margin:0 auto;
    min-height:100vh;
    overflow:hidden;
    border-radius:28px;
    background:rgba(250,250,252,.55);
    backdrop-filter:blur(32px) saturate(1.4);
    -webkit-backdrop-filter:blur(32px) saturate(1.4);
    box-shadow:
      0 0 120px rgba(100,120,140,.22),
      -60px 0 100px -20px rgba(90,135,171,.18),
      60px 0 100px -20px rgba(100,160,140,.18);
  }
  .app::before{
    content:"";
    position:absolute;
    top:0; left:0;
    width:100%; height:100%;
    z-index:-1;
    background:
      radial-gradient(ellipse 75% 50% at 15% 5%, rgba(80,130,180,.6), transparent 60%),
      radial-gradient(ellipse 65% 45% at 90% 12%, rgba(120,155,175,.55), transparent 55%),
      radial-gradient(ellipse 100% 55% at 50% 100%, rgba(100,120,135,.65), transparent 55%),
      linear-gradient(170deg,
        #5a87ab 0%,
        #6b96a5 25%,
        #7ea79a 48%,
        #8f9f85 68%,
        #9da084 82%,
        #6d7a86 100%);
  }
  .win-titlebar{
    display:flex; align-items:center; gap:10px;
    padding:14px 20px;
    border-bottom:1px solid rgba(0,0,0,.06);
    background:linear-gradient(180deg, rgba(255,255,255,.78), rgba(255,255,255,.62));
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    position:sticky; top:0; z-index:10;
  }
  .win-title{font-size:13px; font-weight:600; color:rgba(29,29,31,.7); letter-spacing:.2px; flex:1;}
  .win-actions{display:flex; gap:6px;}

  /* ===== layout ===== */
  .main-body{display:grid; grid-template-columns:320px 1fr; min-height:calc(100vh - 52px);}
  @media(max-width:760px){ .main-body{grid-template-columns:1fr;} }

  /* ===== Sidebar ===== */
  .sidebar{
    background:rgba(255,255,255,.88);
    border-right:1px solid rgba(0,0,0,.06);
    padding:20px 14px;
    display:flex; flex-direction:column; gap:14px;
  }
  .side-section-label{
    font-size:15px; font-weight:700; letter-spacing:.8px;
    color:var(--text-soft); text-transform:uppercase;
    padding:0 12px; margin-bottom:6px;
  }
  .side-stat-card{
    background:rgba(255,255,255,.78);
    border:1px solid rgba(0,0,0,.04);
    border-radius:12px;
    padding:14px 16px;
  }
  .side-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:7px 0; font-size:15px;
  }
  .side-row + .side-row{border-top:1px solid rgba(0,0,0,.04);}
  .side-row .sr-lbl{color:var(--text-3); font-size:14px;}
  .side-row .sr-val{font-weight:600; font-size:16px;}
  .side-row .up{color:var(--red);}
  .side-row .down{color:var(--green);}

  .nav-group{margin-top:2px;}
  .nav-group:first-child{margin-top:0;}
  .nav-group-title{
    font-size:13px; font-weight:700; letter-spacing:.8px;
    color:var(--text-soft); text-transform:uppercase;
    padding:10px 12px 4px;
  }
  .nav-item{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:9px 12px; border-radius:10px; cursor:pointer; transition:background .15s;
    font-size:15px; color:var(--text);
  }
  .nav-item:hover{background:rgba(0,0,0,.04);}
  .nav-item.active{background:#1d1d1f; color:#fff;}
  .nav-item.active .ni-pnl{color:rgba(255,255,255,.85);}
  .nav-item .ni-main{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .nav-item .ni-pnl{font-size:12px; font-weight:600; flex-shrink:0; color:var(--text-2);}

  /* ===== Right column ===== */
  .right-col{
    padding:20px 24px 28px;
    min-width:0;
    /* subtle backdrop to separate from sidebar */
    background:rgba(255,255,255,.38);
  }
  .hero{
    margin-bottom:18px;
  }
  .hero-greeting{
    display:inline-block; background:rgba(255,255,255,.7);
    border:1px solid rgba(0,0,0,.06);
    border-radius:16px; padding:3px 10px;
    font-size:11px; font-weight:600; letter-spacing:.5px;
    color:var(--text-2); margin-bottom:10px;
  }
  .hero h1{
    margin:0; font-size:28px; font-weight:700; letter-spacing:-.5px;
    color:var(--text);
  }
  .hero p{margin:4px 0 0; color:var(--text-3); font-size:13px;}

  .time-bar{
    background:rgba(255,255,255,.85);
    border:1px solid rgba(0,0,0,.06);
    border-radius:14px;
    padding:10px 14px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    margin-bottom:16px;
  }
  .seg{display:flex; background:rgba(0,0,0,.05); border-radius:10px; padding:3px; gap:2px;}
  .seg button{
    border:none; background:transparent; padding:6px 14px; font-size:13px; font-weight:500;
    color:var(--text-2); border-radius:8px; cursor:pointer; transition:all .15s ease; font-family:inherit;
  }
  .seg button.active{background:#fff; color:var(--text); box-shadow:0 1px 2px rgba(0,0,0,.08);}
  .time-label{font-size:13px; color:var(--text-2); margin-left:auto; font-weight:500;}
  .month-picker{
    border:1px solid rgba(0,0,0,.1); background:#fff; border-radius:8px;
    padding:6px 10px; font-size:13px; font-family:inherit; color:var(--text);
    cursor:pointer; outline:none; transition:border-color .15s ease;
  }
  .month-picker:focus{border-color:var(--blue);}

  .seg-top{display:flex; gap:8px; margin-bottom:14px;}
  .seg-top .seg button.active{background:#1d1d1f; color:#fff;}

  /* Stock detail card */
  .stock-card{
    background:rgba(255,255,255,.92);
    border:1px solid rgba(0,0,0,.06);
    border-radius:var(--radius-lg);
    padding:22px;
    backdrop-filter:blur(24px) saturate(1.1);
    -webkit-backdrop-filter:blur(24px) saturate(1.1);
    box-shadow:var(--shadow-card);
  }
  .stock-head{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:16px;}
  .stock-title{font-size:22px; font-weight:700; letter-spacing:-.3px;}
  .stock-sub{font-size:12px; color:var(--text-3); margin-top:3px;}
  .stock-real{text-align:right;}
  .real-price{font-size:26px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-.5px;}
  .real-sub{font-size:12px; color:var(--text-3); margin-top:2px; text-align:right;}

  .pos-grid{display:grid; gap:14px; margin-bottom:16px; grid-template-columns:1fr 1fr 1fr;}
  .pos-card{
    background:rgba(255,255,255,.5);
    border:1px solid rgba(0,0,0,.04);
    border-radius:14px; padding:16px 18px;
  }
  .pos-title{font-size:11px; font-weight:700; letter-spacing:1px; color:var(--text-3); text-transform:uppercase; margin-bottom:6px;}
  .pos-hold{font-size:18px; font-weight:700; letter-spacing:-.3px;}
  .pos-cost{font-size:12px; color:var(--text-3); margin-top:3px;}

  .pnl-row{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-top:1px solid var(--line-strong); gap:12px;}
  .pnl-row .lbl{font-size:12px; font-weight:600; letter-spacing:.8px; color:var(--text-soft); text-transform:uppercase; white-space:nowrap; flex-shrink:0;}
  .pnl-row .val{font-weight:700; font-size:15px; font-variant-numeric:tabular-nums;}
  .up{color:var(--red);}
  .down{color:var(--green);}

  .actions-bar{display:flex; gap:8px; margin-top:16px; flex-wrap:wrap;}

  .chart-box{
    background:rgba(255,255,255,.45);
    border:1px solid rgba(0,0,0,.04);
    border-radius:14px; padding:14px; margin:14px 0;
  }
  .chart-box svg{width:100%; height:auto;}

  .trade-table{background:rgba(255,255,255,.75); border:1px solid rgba(0,0,0,.04); border-radius:14px; overflow:hidden; margin-top:14px;}
  .tt-row{display:grid; grid-template-columns:repeat(7, 1fr); gap:8px; padding:10px 14px; font-size:13px; border-bottom:1px solid var(--line); align-items:center;}
  .tt-row:last-child{border-bottom:none;}
  .tt-row.head{background:rgba(0,0,0,.025); font-weight:700; color:var(--text-soft); font-size:11px; letter-spacing:1px; text-transform:uppercase;}
  .tt-row .buy{color:var(--green); font-weight:600;}
  .tt-row .sell{color:var(--red); font-weight:600;}
  .tt-row .up{color:var(--red); font-weight:600;}
  .tt-row .down{color:var(--green); font-weight:600;}
  @media(max-width:680px){ .tt-row{font-size:12px; padding:8px 10px;} }

  .trade-item{border-bottom:1px solid var(--line); padding:12px 16px;}
  .trade-item:last-child{border-bottom:none;}
  .trade-head{display:flex; justify-content:space-between; align-items:center;}
  .trade-dir{font-size:11px; font-weight:700; padding:2px 8px; border-radius:6px; letter-spacing:.3px;}
  .trade-dir.buy{background:var(--green-soft); color:var(--green);}
  .trade-dir.sell{background:var(--red-soft); color:var(--red);}
  .trade-body{font-size:13px; color:var(--text-2); margin-top:5px;}
  .trade-note{font-size:12px; color:var(--text-3); margin-top:4px;}
  .trade-pnl{font-weight:700; font-size:13px;}

  .list-toggle{text-align:center; padding:10px; font-size:12px; color:var(--blue); cursor:pointer; font-weight:500;}

  /* Buttons */
  .btn{
    appearance:none; border:none; font-family:inherit; cursor:pointer;
    border-radius:10px; padding:8px 14px; font-size:13px; font-weight:500;
    background:rgba(255,255,255,.9); color:var(--text);
    border:1px solid rgba(0,0,0,.08);
    box-shadow:0 1px 0 rgba(255,255,255,.8) inset, 0 1px 2px rgba(0,0,0,.04);
    transition:all .15s ease; display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  }
  .btn:hover{background:#fff; box-shadow:0 1px 0 rgba(255,255,255,.9) inset, 0 2px 6px rgba(0,0,0,.08);}
  .btn:active{transform:translateY(.5px);}
  .btn.primary{background:#1d1d1f; color:#fff; border-color:#1d1d1f; box-shadow:0 1px 0 rgba(255,255,255,.1) inset, 0 2px 6px rgba(0,0,0,.18);}
  .btn.primary:hover{background:#2c2c2e;}
  .btn.ghost{background:transparent; box-shadow:none; border-color:transparent; color:var(--blue);}
  .btn.danger{color:var(--red); border-color:rgba(255,59,48,.3);}
  .btn.small{padding:5px 10px; font-size:12px; border-radius:8px;}

  /* Modals */
  .modal-mask{position:fixed; inset:0; background:rgba(20,25,40,.4); z-index:100; display:none; align-items:center; justify-content:center; backdrop-filter:blur(14px);}
  .modal-mask.show{display:flex;}
  .modal{
    background:rgba(248,248,250,.98); border-radius:18px; width:440px; max-width:92vw; max-height:88vh; overflow-y:auto;
    box-shadow:0 0 0 .5px rgba(0,0,0,.08), 0 30px 80px rgba(20,30,60,.35);
    backdrop-filter:blur(30px);
  }
  .modal-head{display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid var(--line-strong);}
  .modal-head h3{margin:0; font-size:16px; font-weight:600; letter-spacing:-.2px;}
  .modal-body{padding:18px 20px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:11px; font-weight:700; letter-spacing:.8px; color:var(--text-soft); text-transform:uppercase; margin-bottom:6px;}
  .field input, .field select, .field textarea{
    width:100%; border:1px solid rgba(0,0,0,.1); background:#fff; border-radius:10px; padding:9px 12px; font-size:14px;
    font-family:inherit; color:var(--text); outline:none; transition:border-color .15s, box-shadow .15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    border-color:var(--blue); box-shadow:0 0 0 3px rgba(0,122,255,.15);
  }
  .seg-field .seg button{padding:7px 20px;}
  .modal-foot{padding:14px 20px; border-top:1px solid var(--line-strong); display:flex; gap:8px; justify-content:flex-end;}

  /* Misc */
  .detail-empty{text-align:center; padding:50px 30px; color:var(--text-3); font-size:14px;}
  .chart-empty{text-align:center; padding:40px; color:var(--text-3); font-size:13px;}
  .trade-empty{text-align:center; padding:30px; color:var(--text-3); font-size:13px;}

  .toast{
    position:fixed; top:24px; left:50%; transform:translateX(-50%);
    background:rgba(29,29,31,.92); color:#fff; padding:10px 20px; border-radius:24px;
    font-size:13px; font-weight:500; z-index:200; opacity:0; transition:opacity .2s; pointer-events:none;
    box-shadow:0 8px 24px rgba(0,0,0,.25);
  }
  .toast.show{opacity:1;}
  .toast.error{background:var(--red);}

  .chart-tip{
    position:absolute; background:rgba(29,29,31,.9); color:#fff; padding:6px 10px; border-radius:8px;
    font-size:12px; z-index:50; pointer-events:none; opacity:0; transition:opacity .15s; white-space:nowrap;
  }
  .chart-tip.show{opacity:1;}

  @keyframes fadeIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
  .fade-in{animation:fadeIn .3s cubic-bezier(.2,.7,.2,1);}

  .pt-symbol{fill:#aaa;font-size:10px;text-anchor:start;}
  .pt-current{fill:#ff9500;font-size:10px;font-weight:700;}

  /* Nav add stock */
  .nav-item.add-nav{color:var(--blue); font-weight:500;}
  .nav-item.add-nav:hover{background:var(--blue-soft);}

  /* Scroll to top/bottom floating buttons */
  .float-nav{position:fixed; right:20px; bottom:24px; display:flex; flex-direction:column; gap:6px; z-index:90;}
  .float-nav button{
    width:38px; height:38px; border-radius:50%;
    background:rgba(255,255,255,.85); border:1px solid rgba(0,0,0,.08);
    box-shadow:0 2px 8px rgba(0,0,0,.12);
    cursor:pointer; font-size:16px; color:#1d1d1f;
    display:flex; align-items:center; justify-content:center;
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    transition:all .15s;
  }
  .float-nav button:hover{background:#fff; transform:translateY(-1px);}
</style>
</head>
<body>
<div class="app">
  <div class="win-titlebar">
    <div class="win-title">📒 交易日记 · Trading Diary</div>
    <div class="win-actions">
      <button class="btn" onclick="refreshAllPrices()">⟳ 刷新</button>
      <button class="btn" onclick="openSettings()">⚙️ 设置</button>
      <button class="btn" onclick="syncToCloud()">☁️ 同步</button>
      <button class="btn" onclick="restoreFromCloud()">📥 恢复</button>
    </div>
  </div>

  <div class="main-body">
    <aside class="sidebar">
      <div class="side-section-label">概览</div>
      <div class="side-stat-card">
        <div class="side-row"><span class="sr-lbl">持仓盈亏</span></div>
        <div class="side-row"><span class="sr-lbl">总市值</span><span class="sr-val" id="ovMarket">--</span></div>
        <div class="side-row"><span class="sr-lbl">总盈亏</span><span class="sr-val" id="ovPnl">--</span></div>
        <div class="side-row"><span class="sr-lbl">收益率</span><span class="sr-val" id="ovRate">--</span></div>
      </div>
      <div class="side-stat-card">
        <div class="side-row"><span class="sr-lbl">资金进出</span></div>
        <div class="side-row"><span class="sr-lbl">投入</span><span class="sr-val" id="ovBuy">--</span></div>
        <div class="side-row"><span class="sr-lbl">提取</span><span class="sr-val" id="ovSell">--</span></div>
        <div class="side-row"><span class="sr-lbl">净额</span><span class="sr-val" id="ovNet">--</span></div>
      </div>
      <div id="navList"></div>
    </aside>

    <section class="right-col">
      <div class="hero">
        <div class="hero-greeting" id="heroGreeting">📈 Market Overview</div>
        <h1 id="heroTitle">持仓总览</h1>
        <p id="heroSub" class="time-label">全部记录</p>
      </div>

      <div class="time-bar">
        <div class="seg" id="timeSeg">
          <button data-p="month">本月</button>
          <button data-p="quarter">本季</button>
          <button data-p="year">本年</button>
          <button data-p="all" class="active">全部</button>
        </div>
        <input type="month" class="month-picker" id="customMonth" style="display:none">
      </div>

      <div class="seg seg-top" id="viewSeg">
        <button data-v="stock" class="active">股票详情</button>
        <button data-v="trade">交易流水</button>
      </div>

      <div id="detailView"></div>
    </section>
  </div>
</div>

<!-- Trade Modal -->
<div class="modal-mask" id="tradeModal">
  <div class="modal">
    <div class="modal-head"><h3 id="tradeModalTitle">记录交易</h3><button class="btn ghost small" onclick="closeModal('tradeModal')">✕</button></div>
    <div class="modal-body">
      <input type="hidden" id="tradeEditId">
      <div class="field"><label>日期</label><div style="display:flex;gap:8px"><input type="date" id="tradeDate" style="flex:1"><button type="button" class="btn small" onclick="document.getElementById('tradeDate').value=new Date().toISOString().slice(0,10)">今日</button></div></div>
      <div class="field seg-field">
        <label>方向</label>
        <div class="seg" id="tradeDir">
          <button data-v="buy" class="active">买入</button>
          <button data-v="sell">卖出</button>
        </div>
      </div>
      <div class="field seg-field">
        <label>仓位</label>
        <div class="seg" id="tradePos">
          <button data-v="base" class="active">底仓</button>
          <button data-v="mobile">机动</button>
        </div>
      </div>
      <div class="field"><label>价格</label><input type="number" id="tradePrice" step="0.01" placeholder="0.00"></div>
      <div class="field"><label>数量</label><input type="number" id="tradeShares" step="1" placeholder="0"></div>
      <div class="field"><label>决策依据/备注</label><textarea id="tradeNote" rows="2" placeholder="买入/卖出的理由..."></textarea></div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" onclick="closeModal('tradeModal')">取消</button>
      <button class="btn primary" onclick="saveTrade()">保存</button>
    </div>
  </div>
</div>

<!-- Review Modal -->
<div class="modal-mask" id="reviewModal">
  <div class="modal">
    <div class="modal-head"><h3>写复盘</h3><button class="btn ghost small" onclick="closeModal('reviewModal')">✕</button></div>
    <div class="modal-body">
      <div class="field seg-field">
        <label>判断</label>
        <div class="seg" id="reviewJudge">
          <button data-v="correct" class="active">正确</button>
          <button data-v="wrong">错误</button>
          <button data-v="neutral">中性</button>
        </div>
      </div>
      <div class="field"><label>复盘内容</label><textarea id="reviewNote" rows="4" placeholder="这笔交易的复盘..."></textarea></div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" onclick="closeModal('reviewModal')">取消</button>
      <button class="btn primary" onclick="saveReview()">保存</button>
    </div>
  </div>
</div>

<!-- Stock Modal -->
<div class="modal-mask" id="nsModal">
  <div class="modal">
    <div class="modal-head"><h3 id="nsTitle">添加股票</h3><button class="btn ghost small" onclick="closeModal('nsModal')">✕</button></div>
    <div class="modal-body">
      <div class="field"><label>名称</label><input type="text" id="nsName" placeholder="如：小米"></div>
      <div class="field"><label>代码</label><input type="text" id="nsSymbol" placeholder="如：01810"></div>
      <div class="field seg-field">
        <label>市场</label>
        <div class="seg" id="nsMarket">
          <button data-v="A" class="active">A股</button>

function t(key){ return ZH[key] || key; }

const DEFAULT_RATES = { 'HK':0.92, 'US':7.25, 'A':1 };

function fmtMoney(v, dig=2){ if(v==null||isNaN(v)) return '--'; return Number(v).toLocaleString('zh-CN',{maximumFractionDigits:dig, minimumFractionDigits:dig}); }
function fmtPct(v){ if(v==null||isNaN(v)) return '--'; const s = v>0?'+':''; return s + v.toFixed(2) + '%'; }
function fmtCur(v, market, withSign=false, withCny=true){
  if(v==null||isNaN(v)) return '--';
  const rate = rateOf(market);
  const sym = market==='HK'?'HK$':market==='US'?'$':'¥';
  const pre = withSign ? (v>0?'+':'') : '';
  const num = Math.abs(v).toLocaleString('zh-CN',{maximumFractionDigits:2, minimumFractionDigits:2});
  let out = pre + sym + num;
  if(market!=='A' && withCny){
    const cny = Math.abs(v*rate).toLocaleString('zh-CN',{maximumFractionDigits:2, minimumFractionDigits:2});
    out += ' (¥' + cny + ')';
  }
  return out;
}
function rateOf(m){ return (state.settings.rates && state.settings.rates[m]) || DEFAULT_RATES[m] || 1; }

function load(){
  const raw = localStorage.getItem(LS_KEY);
  if(raw){
    try{
      const d = JSON.parse(raw);
      state.stocks = d.stocks || [];
      state.settings = Object.assign(
        { githubToken:'', gistId:'', finnhubKey:'', rates:{ 'HK':0.92, 'US':7.25, 'A':1 } },
        d.settings || {}
      );
      if(!state.settings.rates) state.settings.rates = { 'HK':0.92, 'US':7.25, 'A':1 };
      state.collapsed = d.collapsed || {};
      state.expandedLists = d.expandedLists || {};
      if(d.selectedStock) state.selectedStock = d.selectedStock;
      if(d.view) state.view = d.view;
    }catch(e){ console.error('load error', e); }
  }
  if(state.stocks.length === 0){ state.stocks = sampleData(); save(); }
  if(!state.selectedStock && state.stocks.length) state.selectedStock = state.stocks[0].id;
  if(!state.view) state.view = 'stock';
}
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(state)); }

function inPeriod(date){
  const d = new Date(date);
  if(currentPeriod==='all') return true;
  const now = new Date();
  if(currentPeriod==='year') return d.getFullYear()===now.getFullYear();
  if(currentPeriod==='month'){
    if(customYM){ const [y,m] = customYM.split('-').map(Number); return d.getFullYear()===y && d.getMonth()+1===m; }
    return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
  }
  if(currentPeriod==='quarter'){
    const q = ['Q1','Q2','Q3','Q4'][Math.floor(d.getMonth()/3)];
    const nowQ = ['Q1','Q2','Q3','Q4'][Math.floor(now.getMonth()/3)];
    return d.getFullYear()===now.getFullYear() && q===nowQ;
  }
  return false;
}
function periodLabel(){
  if(currentPeriod==='all') return t('all_records');
  if(currentPeriod==='month'){
    if(customYM){ const [y,m] = customYM.split('-'); return `${y}-${m.padStart(2,'0')}`; }
    const now = new Date(); return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  }
  if(currentPeriod==='quarter'){
    const now = new Date();
    const q = ['Q1','Q2','Q3','Q4'][Math.floor(now.getMonth()/3)];
    return `${now.getFullYear()} ${q}`;
  }
  if(currentPeriod==='year'){
    const now = new Date(); return `${now.getFullYear()}`;
  }
  return '';
}

function sortedStocks(){
  const order = { 'A':0, 'HK':1, 'US':2 };
  return [...state.stocks].sort((a,b)=>{
    if(order[a.market]!==order[b.market]) return order[a.market]-order[b.market];
    return a.symbol.localeCompare(b.symbol);
  });
}

function computeStats(stocks, allTrades){
  let market=0, invest=0, withdraw=0, cost=0, realized=0;
  stocks.forEach(s=>{
    market += (s.realPrice||0) * (s.baseHold+s.mobileHold);
    cost += s.baseHold*s.baseCost + s.mobileHold*s.mobileCost;
  });
  allTrades.forEach(t=>{
    if(!inPeriod(t.date)) return;
    if(t.dir==='buy'){ invest += t.price*t.shares; cost += t.price*t.shares; }
    else{ withdraw += t.price*t.shares; realized += t.realizedPnL||0; }
  });
  const pnl = market - cost;
  const rate = cost>0 ? (pnl/cost)*100 : 0;
  return { market, invest, withdraw, net: withdraw-invest, pnl, rate, realized };
}

function avgCost(s){
  const th = s.baseHold + s.mobileHold;
  if(th===0) return 0;
  return (s.baseHold*s.baseCost + s.mobileHold*s.mobileCost) / th;
}

function stockPnL(s){
  const th = s.baseHold + s.mobileHold;
  const cost = avgCost(s);
  const unrealized = th * ((s.realPrice||0) - cost);
  let realized = 0;
  s.trades.forEach(t=>{ if(t.dir==='sell') realized += t.realizedPnL||0; });
  return { unrealized, realized, total: unrealized+realized, rate: cost>0?(unrealized+realized)/(cost*th)*100:0 };
}

function renderChart(stock){
  const chart = document.getElementById('stockChart');
  if(!chart) return '';
  const W=400, H=140, padL=36, padR=12, padT=12, padB=22;
  const trades = stock.trades.filter(t=> t.dir==='buy' || t.dir==='sell').sort((a,b)=> a.date.localeCompare(b.date));
  const points = trades.map(t=>({ date:t.date, price:t.price, dir:t.dir }));
  if(stock.realPrice!=null) points.push({date:'current', price:stock.realPrice, dir:'current'});
  if(points.length<2) return '<div class="chart-empty">'+t('no_chart_data')+'</div>';
  const prices = points.map(p=>p.price);
  let minP = Math.min(...prices), maxP = Math.max(...prices);
  if(minP===maxP){ minP*=0.95; maxP*=1.05; }
  const yPad = (maxP-minP)*0.1;
  minP -= yPad; maxP += yPad;
  const coords = points.map((p,i)=>{
    const x = padL + (i/(points.length-1))*(W-padL-padR);
    const y = padT + (1-(p.price-minP)/(maxP-minP))*(H-padT-padB);
    return { x, y, ...p };
  });
  const linePath = coords.map((c,i)=> (i===0?'M':'L')+c.x.toFixed(1)+' '+c.y.toFixed(1)).join(' ');
  const areaPath = linePath + ` L${coords[coords.length-1].x.toFixed(1)} ${H-padB} L${padL} ${H-padB} Z`;
  const yTicks = 4;
  let yLabels = '';
  for(let i=0;i<=yTicks;i++){
    const v = maxP - (maxP-minP)*(i/yTicks);
    const y = padT + (i/yTicks)*(H-padT-padB);
    yLabels += `<line x1="${padL}" x2="${W-padR}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#eee"/>`;
    yLabels += `<text x="${padL-4}" y="${y.toFixed(1)}" text-anchor="end" dominant-baseline="middle" font-size="9" fill="#aaa">${v.toFixed(2)}</text>`;
  }
  let xLabels = '';
  [0, coords.length-1].forEach(i=>{
    const c = coords[i];
    const label = c.date==='current'?t('now'):c.date.slice(5);
    xLabels += `<text x="${c.x.toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="10" fill="#888">${label}</text>`;
  });
  let dots = '';
  let buySell = '';
  coords.forEach(c=>{
    const cls = c.dir==='buy'?'buy':c.dir==='sell'?'sell':'cur';
    dots += `<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="3" fill="white" stroke="${cls==='buy'?'#34c759':cls==='sell'?'#ff3b30':'#ff9500'}" stroke-width="2" class="chart-pt ${cls}" data-price="${c.price}" data-date="${c.date}"/>`;
  });
  return `
    <svg viewBox="0 0 ${W} ${H}" class="chart-svg" style="width:100%;height:auto" data-stock="${stock.id}">
      <defs><linearGradient id="ag-${stock.id}" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0%" stop-color="rgba(0,122,255,.18)"/>
        <stop offset="100%" stop-color="rgba(0,122,255,0)"/>
      </linearGradient></defs>
      ${yLabels}
      ${xLabels}
      <path d="${linePath}" fill="none" stroke="#007aff" stroke-width="1.5"/>
      <path d="${areaPath}" fill="url(#ag-${stock.id})"/>
      ${dots}
    </svg>`;
}

function attachChartTips(){
  document.querySelectorAll('.chart-pt').forEach(pt=>{
    pt.addEventListener('mouseenter', e=>{

      const wr = document.querySelector('.chart-box').getBoundingClientRect();

      t.style.top = (pr.top - wr.top - 30) + 'px';
      t.classList.add('show');
    });
    pt.addEventListener('mouseleave', ()=> document.getElementById('chartTip').classList.remove('show'));
  });
}

    </div>`;
  }).join('');
  const toggle = allTrades.length>LIMIT ? `<div class="list-toggle" onclick="toggleListExpand('${stock.id}')">${collapsed?t('expand_all')+' ('+allTrades.length+')':t('collapse')}</div>` : '';
  const chartHTML = renderChart(stock);
  return `

        </div>
        <div class="pos-card">
          <div class="pos-title">${t('base_pos')}</div>
          <div class="pos-hold">${stock.baseHold} ${t('shares_unit')}</div>
          <div class="pos-cost">${t('cost')} ${fmtCur(stock.baseCost, stock.market)}</div>
        </div>

}

function renderTradeList(){
  const allTrades = [];
  state.stocks.forEach(s=>{ s.trades.forEach(t=>{ allTrades.push({...t, _stock:s}); }); });
  const filtered = allTrades.filter(t=> inPeriod(t.date));
  filtered.sort((a,b)=> b.date.localeCompare(a.date) || (b.price||0)-(a.price||0));
  if(filtered.length===0){
    return '<div class="stock-card"><div class="detail-empty">'+t('no_period_trades')+'</div></div>';
  }
  const dirMap = { buy:t('buy'), sell:t('sell') };
  const marketSym = { A:'¥', HK:'HK$', US:'$' };
  let html = '<div class="stock-card fade-in"><table class="tt-row">';
  html += '<div class="tt-row head"><div>'+t('th_stock')+'</div><div>'+t('th_date')+'</div><div>'+t('th_dir')+'</div><div>'+t('th_shares')+'</div><div>'+t('th_price')+'</div><div>'+t('th_amount')+'</div><div>'+t('th_pnl')+'</div></div>';
  filtered.forEach(t=>{
    const amt = t.price * t.shares * (t.dir==='sell'?1:-1);
    const sign = t.dir==='sell'?'+':'';
    const sign2 = (t.realizedPnL||0)>=0?'+':'';
    html += `<div class="tt-row" style="cursor:pointer" onclick="selectStock('${t._stock.id}')">
      <div><strong>${t._stock.name}</strong><br><span style="color:var(--text-3);font-size:11px">${t._stock.symbol}</span></div>
      <div>${t.date}</div>
      <div class="${t.dir}">${dirMap[t.dir]}</div>
      <div>${t.shares}</div>
      <div>${marketSym[t._stock.market]}${fmtMoney(t.price)}</div>
      <div>${sign}${marketSym[t._stock.market]}${fmtMoney(Math.abs(amt))}</div>
      <div class="${(t.realizedPnL||0)>=0?'up':'down'}">${t.dir==='sell'? sign2+fmtMoney(t.realizedPnL||0):'—'}</div>
    </div>`;
  });
  html += '</table></div>';
  return html;
}

function openTradeModal(stockId, tradeId){

    setSeg('tradeDir','buy'); setSeg('tradePos','mobile');

function applyTradeToStock(stock, dir, pos, price, shares){
  if(dir==='buy'){
    if(pos==='base'){ stock.baseCost = (stock.baseHold*stock.baseCost + shares*price)/(stock.baseHold+shares); stock.baseHold += shares; }
    else{ stock.mobileCost = (stock.mobileHold*stock.mobileCost + shares*price)/(stock.mobileHold+shares); stock.mobileHold += shares; }
  } else {
    if(pos==='base'){ stock.baseHold = Math.max(0, stock.baseHold - shares); if(stock.baseHold===0) stock.baseCost=0; }
    else{ stock.mobileHold = Math.max(0, stock.mobileHold - shares); if(stock.mobileHold===0) stock.mobileCost=0; }
  }
}

function reverseTradeFromStock(stock, tr){
  // 反向操作：把这笔交易的影响撤掉
  if(tr.dir==='buy'){
    // 撤销买入 = 卖出
    if(tr.pos==='base'){ stock.baseHold = Math.max(0, stock.baseHold - tr.shares); if(stock.baseHold===0) stock.baseCost=0; }
    else{ stock.mobileHold = Math.max(0, stock.mobileHold - tr.shares); if(stock.mobileHold===0) stock.mobileCost=0; }
  } else {
    // 撤销卖出 = 买入（用当时的成本价恢复）
    const ac = tr.pos==='base' ? stock.baseCost : stock.mobileCost;
    if(tr.pos==='base'){ stock.baseCost = (stock.baseHold*stock.baseCost + tr.shares*ac)/(stock.baseHold+tr.shares); stock.baseHold += tr.shares; }
    else{ stock.mobileCost = (stock.mobileHold*stock.mobileCost + tr.shares*ac)/(stock.mobileHold+tr.shares); stock.mobileHold += tr.shares; }
  }
}

function saveTrade(){
  const stock = state.stocks.find(s=> s.id===state.selectedStock);
  if(!stock) return;
  const date = document.getElementById('tradeDate').value;
  const price = parseFloat(document.getElementById('tradePrice').value);
  const shares = parseInt(document.getElementById('tradeShares').value);
  const note = document.getElementById('tradeNote').value;
  const dirBtn = document.querySelector('#tradeDir button.active');
  const posBtn = document.querySelector('#tradePos button.active');
  const editId = document.getElementById('tradeEditId').value;
  if(!date || isNaN(price) || isNaN(shares) || shares<=0){ toast(t('fill_date_price'), true); return; }
  const dir = dirBtn.dataset.v, pos = posBtn.dataset.v;

  if(editId){
    // 编辑模式：先删掉旧交易对持仓的影响，重建持仓，再加新交易
    const oldTr = stock.trades.find(t=> t.id===editId);
    // 按时间顺序重建所有交易的持仓影响（跳过旧的那笔）
    stock.baseHold = 0; stock.baseCost = 0;
    stock.mobileHold = 0; stock.mobileCost = 0;
    const sorted = [...stock.trades].sort((a,b)=> a.date.localeCompare(b.date));
    for(const tr of sorted){
      if(tr.id===editId) continue;
      applyTradeToStock(stock, tr.dir, tr.pos, tr.price, tr.shares);
    }
    // 移除旧交易
    stock.trades = stock.trades.filter(t=> t.id!==editId);
  }

  let realizedPnL = 0;
  if(dir==='sell'){
    const ac = pos==='base' ? stock.baseCost : stock.mobileCost;
    realizedPnL = (price - ac) * shares;
  }
  const newT = { id: editId || 't'+Date.now(), date, dir, pos, price, shares, reason:'', note, realizedPnL };
  stock.trades.push(newT);
  applyTradeToStock(stock, dir, pos, price, shares);

  save(); closeModal('tradeModal');
  document.getElementById('tradeEditId').value = '';
  toast(editId ? '交易已更新' : ((dir==='buy'?t('t_bought'):t('t_sold'))+' '+shares+' '+t('shares_unit')+' @ '+price));
  render();
  attachChartTips();
}

function deleteTrade(stockId, tradeId){
  if(!confirm('确定要删除这笔交易吗？持仓会自动调整回来。')) return;
  const stock = state.stocks.find(s=> s.id===stockId);
  if(!stock) return;
  // 重建持仓，跳过要删除的交易
  stock.baseHold = 0; stock.baseCost = 0;
  stock.mobileHold = 0; stock.mobileCost = 0;
  const sorted = [...stock.trades].sort((a,b)=> a.date.localeCompare(b.date));
  for(const tr of sorted){
    if(tr.id===tradeId) continue;
    applyTradeToStock(stock, tr.dir, tr.pos, tr.price, tr.shares);
  }
  stock.trades = stock.trades.filter(t=> t.id!==tradeId);
  save(); render();
  toast('交易已删除');
}

async function fetchPrice(stock){
  try{
    let prefix = '';
    if(stock.market==='HK') prefix = 'hk';
    else if(stock.market==='US') prefix = 'us';
    else if(stock.market==='A'){
      // 上交所 6开头, 深交所 0/3开头
      const s = String(stock.symbol);
      prefix = s.startsWith('6') ? 'sh' : 'sz';
    }
    const url = `https://qt.gtimg.cn/q=${prefix}${stock.symbol.toLowerCase()}`;
    const res = await fetch(url);
    const txt = await res.text();
    const idx = txt.indexOf('"');
    if(idx<0) throw new Error('no data');
    const data = txt.slice(idx+1, txt.lastIndexOf('"'));
    const parts = data.split('~');
    if(parts[3]) stock.realPrice = parseFloat(parts[3]);
  }catch(e){
    // 腾讯接口失败, 美股尝试 Finnhub 备用
    if(stock.market==='US' && state.settings.finnhubKey){
      try{
        const fr = await fetch(`https://finnhub.io/api/v1/quote?symbol=${stock.symbol}&token=${state.settings.finnhubKey}`);
        const fd = await fr.json();
        if(fd && fd.c) stock.realPrice = fd.c;
      }catch(e2){ /* silent */ }
    }
  }
}

async function syncToCloud(){
  const token = state.settings.githubToken;
  const gistId = state.settings.gistId;
  if(!token){ toast(t('fill_token'), true); return; }
  toast(t('uploading'));
  try{
    let url = gistId? `https://api.github.com/gists/${gistId}` : 'https://api.github.com/gists';
    let method = gistId? 'PATCH' : 'POST';
    const payload = {
      description: 'Trading Diary Backup',
      files:{ 'trading_diary.json':{ content: JSON.stringify(state, null, 2) } }
    };
    const res = await fetch(url,{
      method, headers:{ 'Authorization':'Bearer '+token, 'Accept':'application/vnd.github.v3+json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if(!gistId && data.id){ state.settings.gistId = data.id; save(); }
    toast(t('synced'));
  }catch(e){ toast(t('sync_fail')+e.message, true); }
}

async function restoreFromCloud(){
  const token = state.settings.githubToken;
  const gistId = state.settings.gistId;
  if(!token||!gistId){ toast(t('fill_token_gist'), true); return; }
  if(!confirm(t('confirm_restore'))) return;
  toast(t('restoring'));
  try{
    const res = await fetch('https://api.github.com/gists/'+gistId, {
      headers:{ 'Authorization':'Bearer '+token }
    });
    const data = await res.json();
    const file = data.files && data.files['trading_diary.json'];
    if(file && file.content){
      state = JSON.parse(file.content);
      save(); render();
      toast(t('restored'));
    }else{ toast(t('no_data'), true); }
  }catch(e){ toast(t('restore_fail')+e.message, true); }
}

function importData(){

    const file = e.target.files[0];
    try{
      const txt = await file.text();
      const d = JSON.parse(txt);
      state = d; save(); render();
    }catch(e){ toast(t('import_fail')+e.message, true); }

  input.click();
}
